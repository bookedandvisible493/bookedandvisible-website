name: HTML Integrity Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check CSS brace balance and links
        run: |
          cat << 'PYEOF' > check_html.py
          import glob, os, re, sys

          errors = []

          # Recursively find HTML pages, but skip the /archive/ folder: it holds
          # frozen historical snapshots of old pages (kept for reference), so its
          # internal links intentionally point at paths that no longer exist on
          # the live site.
          html_files = sorted(
              p.replace(os.sep, '/') for p in glob.glob('**/*.html', recursive=True)
              if not p.replace(os.sep, '/').startswith('archive/')
          )

          all_files = set()
          all_dirs = set()
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  rel = os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/')
                  all_files.add(rel)
              for d in dirs:
                  reld = os.path.relpath(os.path.join(root, d), '.').replace(os.sep, '/')
                  all_dirs.add(reld)

          def link_exists(href, page_path):
              target = href.split('#')[0].split('?')[0]
              if not target:
                  return True
              if target.startswith('/'):
                  base = target.lstrip('/')
              else:
                  page_dir = os.path.dirname(page_path)
                  base = os.path.normpath(os.path.join(page_dir, target)).replace(os.sep, '/')
                  if base == '.':
                      base = ''
              if base == '':
                  return True
              if base.endswith('/'):
                  base = base.rstrip('/')
                  return (base + '/index.html') in all_files
              if base in all_files:
                  return True
              if base in all_dirs and (base + '/index.html') in all_files:
                  return True
              return False

          for path in html_files:
              with open(path, encoding='utf-8') as f:
                  content = f.read()

              for i, style_block in enumerate(re.findall(r'<style[^>]*>(.*?)</style>', content, re.DOTALL)):
                  opens = style_block.count('{')
                  closes = style_block.count('}')
                  if opens != closes:
                      errors.append(
                          f"{path}: style block #{i+1} has unbalanced braces "
                          f"({opens} open vs {closes} close)"
                      )

              for href in re.findall(r'href="([^"]*)"', content):
                  stripped = href.strip()
                  if stripped == '':
                      errors.append(f"{path}: empty href")
                  elif stripped == '#':
                      errors.append(f"{path}: placeholder href=#")
                  elif 'TODO' in href or 'PLACEHOLDER' in href.upper():
                      errors.append(f"{path}: placeholder/TODO href: {href}")
                  elif 'payhip.com/order?' in href:
                      errors.append(f"{path}: dead Payhip order-link pattern: {href}")
                  elif href.startswith(('http://', 'https://', 'mailto:', 'tel:', '#')):
                      pass
                  else:
                      if not link_exists(href, path):
                          errors.append(f"{path}: internal link points to missing file: {href}")

          if errors:
              print("HTML integrity check FAILED:")
              print("")
              for e in errors:
                  print(" - " + e)
              sys.exit(1)
          else:
              print(f"HTML integrity check passed for {len(html_files)} file(s).")
          PYEOF
          python3 check_html.py
